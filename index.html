<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Money Quest turns your personal finance Excel into a game. Your file is read on this device and never uploaded.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Money Quest">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Money Quest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/space-grotesk-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main>
      <section class="view" id="view-home" data-tab="home" aria-label="Home"></section>
      <section class="view" id="view-wealth" data-tab="wealth" aria-label="Wealth" hidden></section>
      <section class="view" id="view-allocation" data-tab="allocation" aria-label="Allocation" hidden></section>
      <section class="view" id="view-spend" data-tab="spend" aria-label="Spend" hidden></section>
      <section class="view" id="view-quest" data-tab="quest" aria-label="Quest" hidden></section>
    </main>
    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Sections"></nav>
  </div>
  <input type="file" id="file" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <noscript><p style="padding:24px">Money Quest needs JavaScript to read your Excel file on this device.</p></noscript>
  <script src="vendor/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
